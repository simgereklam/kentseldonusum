[vars]
SITE_ORIGINS = "https://xn--kentseldnm-lcb7ea99k.com.tr,https://www.xn--kentseldnm-lcb7ea99k.com.tr,https://kentseldönüşüm.com.tr,https://www.kentseldönüşüm.com.tr"\nGEMINI_TTS_MODEL = "gemini-2.5-flash-preview-tts"

