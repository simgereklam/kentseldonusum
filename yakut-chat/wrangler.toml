# Required private Worker secrets: GEMINI_API_KEY, TAVILY_API_KEY, FIRECRAWL_API_KEY.
# Configure secrets privately with: wrangler secret put GEMINI_API_KEY
# wrangler secret put TAVILY_API_KEY
# wrangler secret put FIRECRAWL_API_KEY
# Never store API key values in this file or in frontend JavaScript.
