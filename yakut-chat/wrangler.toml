# Server-only secrets: GEMINI_API_KEY, TAVILY_API_KEY, FIRECRAWL_API_KEY, TINYFISH_API_KEY.
# Configure secrets privately with: wrangler secret put GEMINI_API_KEY
# wrangler secret put TAVILY_API_KEY
# wrangler secret put FIRECRAWL_API_KEY
# wrangler secret put TINYFISH_API_KEY
# Never store API key values in this file or in frontend JavaScript.
# ONLY Gemini Aoede generates voice. Search providers are Tavily, Firecrawl, TinyFish.
# The Gemini API key must belong to a billing-enabled Google project if paid usage is required.
