<!doctype html><html lang="tr"><head><meta name="yakut-chat-endpoint" content="https://kumtas-yakut-chat.simgereklam.workers.dev/chat"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>YAKUT ses denemesi</title><style>body{font:18px system-ui;max-width:640px;margin:10vh auto;padding:20px}button{font:inherit;padding:14px 22px}p{line-height:1.5}</style></head><h2>KUMTAŞ İNŞAAT – Yakut ses testi</h2><p>Yakut’un canlı bağlantısını denemek için düğmeye basın.</p><button id="play">Ses denemesi başlat</button><p id="status" role="status">Hazır.</p>
<script src="yakut-site-voice.js"></script>
<script type="module">
const button = document.querySelector('#play');
const status = document.querySelector('#status');
let context;
button.onclick = async () => {
  button.disabled = true;
  status.textContent = 'Yakut ses hazırlıyor…';
  try {
    context ??= new (window.AudioContext || window.webkitAudioContext)();
    await context.resume();
    const response = await fetch(new URL('/live', window.yakutChatServiceUrl), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({readAloud: 'Merhaba, ben KUMTAŞ İNŞAAT asistanınız Yakut.'}),
      signal: AbortSignal.timeout(50000)
    });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    if (!response.headers.get('content-type')?.includes('application/x-ndjson'))
      throw new Error('Ses akışı alınamadı.');
    const frames = (await response.text()).trim().split('\n').map(line => JSON.parse(line));
    if (!frames.at(-1)?.done) throw new Error('Ses aktarımı tamamlanamadı.');
    const parts = frames.filter(frame => frame.audio).map(frame => atob(frame.audio));
    const bytes = parts.reduce((sum, part) => sum + part.length, 0);
    if (!bytes || parts.some(part => part.length % 2)) throw new Error('Ses verisi eksik.');
    const buffer = context.createBuffer(1, bytes / 2, 24000);
    const samples = buffer.getChannelData(0);
    let index = 0;
    for (const part of parts) {
      for (let i = 0; i < part.length; i += 2) {
        const value = part.charCodeAt(i) | (part.charCodeAt(i + 1) << 8);
        samples[index++] = (value << 16 >> 16) / 32768;
      }
    }
    const source = context.createBufferSource();
    source.buffer = buffer;
    source.connect(context.destination);
    status.textContent = 'Yakut konuşuyor.';
    await new Promise(resolve => { source.onended = resolve; source.start(); });
    status.textContent = 'Canlı ses denemesi tamamlandı.';
  } catch (error) {
    status.textContent = 'Canlı ses denemesi başarısız. ' + error.message;
  } finally {
    button.disabled = false;
  }
};
</script>
