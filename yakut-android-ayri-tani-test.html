<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yakut Android Mikrofon Tanı Testi</title>
<style>body{font:16px system-ui;background:#101827;color:#f3f6ff;padding:18px;max-width:700px;margin:auto}button{font:inherit;padding:12px;margin:4px;border:0;border-radius:9px;background:#38bdf8;color:#071827}button:disabled{opacity:.4}#log{white-space:pre-wrap;background:#1e293b;padding:12px;border-radius:10px;max-height:390px;overflow:auto}meter{width:100%;height:28px}strong{color:#7dd3fc}</style></head><body>
<h2>Yakut Android — Mikrofon / Tanıma Ayrı Test</h2>
<p><strong>Test 1:</strong> Yalnızca mikrofon sesini ölçer. <strong>Test 2:</strong> Yalnızca Android konuşma tanımasını açar. <strong>Test 3:</strong> Uzun demo konuşurken SUS/DUR ile duraklat, DEVAM ET ile sürdür. Ana Yakut değişmez.</p>
<button id="mic">1 — Mikrofonu ölç</button><button id="stt">2 — Konuşmayı tanı</button><button id="demo">3 — Tanıma + demo sesi</button><button id="resume">Devam et (elle)</button><button id="stop">Kapat</button>
<p>Durum: <strong id="state">Hazır</strong></p><p>Mikrofon seviyesi: <meter id="meter" min="0" max="1" value="0"></meter> <span id="rms">0.0000</span></p><p>Son algılanan: <strong id="heard">—</strong></p><pre id="log"></pre>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),log=s=>{$('log').textContent=new Date().toLocaleTimeString('tr-TR')+' '+s+'\n'+$('log').textContent.slice(0,9500)},state=s=>{$('state').textContent=s;log(s)};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let mode='',generation=0,stream=null,ctx=null,analyser=null,data=null,frame=0,rec=null,retry=0,tries=0,speech=null,closing=false,demoActive=false,demoPaused=false,lastCommand='',lastCommandAt=0;
function stop(){demoActive=false;demoPaused=false;lastCommand='';lastCommandAt=0;generation++;mode='';clearTimeout(retry);cancelAnimationFrame(frame);try{rec?.abort()}catch{}rec=null;try{speechSynthesis.cancel()}catch{}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(ctx){ctx.close().catch(()=>{});ctx=null}analyser=null;$('meter').value=0;$('rms').textContent='0.0000';}
function startMic(){stop();const id=generation;mode='mic';state('Test 1: Mikrofon izni isteniyor');navigator.mediaDevices?.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:false}}).then(async s=>{if(id!==generation){s.getTracks().forEach(t=>t.stop());return}stream=s;ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();if(id!==generation)return;analyser=ctx.createAnalyser();analyser.fftSize=2048;data=new Float32Array(analyser.fftSize);ctx.createMediaStreamSource(s).connect(analyser);state('Test 1: Mikrofon seviyesi ölçülüyor — konuş ve çubuğu izle');let last=0;const tick=now=>{if(id!==generation)return;analyser.getFloatTimeDomainData(data);let sum=0;for(const x of data)sum+=x*x;const rms=Math.sqrt(sum/data.length);$('meter').value=Math.min(1,rms*12);$('rms').textContent=rms.toFixed(4);if(now-last>2000){log('Mikrofon RMS: '+rms.toFixed(4));last=now}frame=requestAnimationFrame(tick)};frame=requestAnimationFrame(tick)}).catch(e=>state('Mikrofon hatası: '+e.name+' '+e.message))}
function startRecognition(withDemo){stop();const id=generation;mode=withDemo?'both':'stt';tries=0;$('heard').textContent='—';if(!SR){state('Bu tarayıcı SpeechRecognition desteklemiyor');return}state(withDemo?'Test 3: Tanıma + demo sesi':'Test 2: Yalnızca konuşma tanıma');function listen(){if(id!==generation||rec)return;if(tries++>40){state('Çok fazla yeniden başlatma — durduruldu');return}const r=new SR();rec=r;r.lang='tr-TR';r.continuous=false;r.interimResults=true;r.maxAlternatives=3;r.onstart=()=>log('Tanıma başladı (oturum '+tries+')');r.onaudiostart=()=>log('Tanıma ses girişi başladı');r.onsoundstart=()=>log('Ses etkinliği görüldü');r.onspeechstart=()=>log('Konuşma başlangıcı görüldü');r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];const t=x[0]?.transcript||'';$('heard').textContent=t;log('SONUÇ '+(x.isFinal?'KESİN':'GEÇİCİ')+': '+t);if(!withDemo)continue;const words=t.toLocaleLowerCase('tr-TR').replace(/[^a-zçğıöşü\s]/g,' ').trim().split(/\s+/);const command=words.includes('sus')||words.includes('dur')?'stop':words.includes('devam')&&words.includes('et')?'resume':'';if(!command)continue;const now=Date.now();if(lastCommand===command&&now-lastCommandAt<1800)continue;if(command==='stop'&&demoActive&&!demoPaused){lastCommand=command;lastCommandAt=now;demoPaused=true;try{speechSynthesis.pause()}catch{}state('DURDURULDU — sesli komut: '+t);log('SES DURAKLATILDI: demo devam ederken komut algılandı')}else if(command==='resume'&&demoActive&&demoPaused){lastCommand=command;lastCommandAt=now;demoPaused=false;try{speechSynthesis.resume()}catch{}state('DEVAM EDİYOR — sesli komut: '+t);log('SES DEVAM ETTİ: kaldığı yerden')}}};r.onerror=e=>{log('Tanıma hatası: '+e.error);if(e.error==='not-allowed'||e.error==='service-not-allowed'){state('Tanıma izni/servisi kullanılamıyor');stop()}};r.onend=()=>{if(rec===r)rec=null;log('Tanıma oturumu bitti');if(id===generation)retry=setTimeout(listen,250)};try{r.start()}catch(e){rec=null;log('Başlatma hatası: '+e.name+' '+e.message);retry=setTimeout(listen,500)}}listen();if(withDemo){const u=new SpeechSynthesisUtterance('Merhaba, ben Yakut. Şimdi size Kumtaş İnşaat hakkında bilgi vereceğim. Firmamız iki bin dört yılından bu yana inşaat sektöründe faaliyet gösteriyor. Kentsel dönüşüm çalışmalarıyla ilgili sorularınızı yanıtlamak ve süreç hakkında bilgi vermek için buradayım. Yapıların güvenliği, başvuru süreçleri, keşif hizmetleri ve imar hesaplamaları konusunda bilgi alabilirsiniz. Bu uzun deneme konuşmasında sesli komutlarınızı test ediyoruz. Ben konuşurken istediğiniz anda araya girebilirsiniz. Biraz daha bilgi vermeye devam ediyorum. Yapı sahipleri için doğru bilgiye ulaşmak ve gerekli belgeleri hazırlamak önemlidir. Size yardımcı olmak için buradayım.');u.lang='tr-TR';u.onstart=()=>{demoActive=true;demoPaused=false;log('Demo konuşması başladı — konuşurken SUS veya DUR de')};u.onend=()=>{demoActive=false;demoPaused=false;log('Demo konuşması bitti')};u.onerror=e=>{demoActive=false;demoPaused=false;log('Demo ses hatası: '+e.error)};try{speechSynthesis.speak(u)}catch(e){log('Demo başlatılamadı: '+e.message)}}}
$('resume').onclick=()=>{if(demoActive&&demoPaused){demoPaused=false;speechSynthesis.resume();state('Elle devam ettirildi')}else log('Devam ettirilecek duraklatılmış demo yok')};$('mic').onclick=startMic;$('stt').onclick=()=>startRecognition(false);$('demo').onclick=()=>startRecognition(true);$('stop').onclick=()=>{stop();state('Kapalı')};window.addEventListener('pagehide',stop);log('Hazır. Önce Test 1, sonra Test 2, sonra Test 3. Testler sırayla çalışır.');
})();
</script></body></html>
