<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yakut Android Ses Tanılama</title><style>body{font:16px system-ui;background:#07192a;color:#fff;max-width:650px;margin:24px auto;padding:16px}button{font:inherit;padding:15px;margin:7px 3px;border:0;border-radius:10px;background:#1686d3;color:white}pre{white-space:pre-wrap;background:#122e45;padding:12px;min-height:170px;border-radius:9px}#bar{height:22px;background:#1381c6;width:0;border-radius:9px} .meter{background:#23445b;border-radius:9px}</style></head><body><h2>Yakut — Android Chrome ses testi</h2><p>Bu sayfa ana Yakut'u değiştirmez. Mikrofonun ses çalarken açık kalıp kalmadığını gösterir.</p><button id="start">Mikrofonu başlat</button><button id="play">Deneme sesini çal</button><button id="stop">Durdur</button><div class="meter"><div id="bar"></div></div><pre id="log"></pre><script>let stream,ctx,analyser,rec,enabled=false,playing=false,loops=0;const log=t=>{document.querySelector('#log').textContent=new Date().toLocaleTimeString('tr-TR')+' '+t+'\n'+document.querySelector('#log').textContent.slice(0,4500)};function listen(){if(!enabled||rec)return;const API=window.SpeechRecognition||window.webkitSpeechRecognition;if(!API){log('Web Speech API yok; mikrofon seviye testi yine çalışır');return}try{const r=new API();rec=r;r.lang='tr-TR';r.continuous=true;r.interimResults=true;r.onstart=()=>log('Ses tanıma başladı');r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;log((e.results[i].isFinal?'SON: ':'ARA: ')+t);if(/\\b(sus|dur|devam et)\\b/i.test(t))log('KOMUT ALGILANDI: '+t)}};r.onerror=e=>log('TANIMA HATASI: '+e.error);r.onend=()=>{if(rec!==r)return;rec=null;log('Tanıma kapandı #'+(++loops));if(enabled)setTimeout(listen,300)};r.start()}catch(e){rec=null;log('Tanıma başlatılamadı: '+e.message);if(enabled)setTimeout(listen,800)}}async function start(){try{enabled=true;stream??=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});ctx??=new AudioContext();await ctx.resume();analyser??=ctx.createAnalyser();const source=ctx.createMediaStreamSource(stream);source.connect(analyser);log('Bağımsız mikrofon açık');function draw(){if(!enabled)return;const a=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(a);let n=0;for(const v of a)n+=((v-128)/128)**2;document.querySelector('#bar').style.width=Math.min(100,Math.sqrt(n/a.length)*300)+'%';requestAnimationFrame(draw)}draw();listen()}catch(e){log('MİKROFON HATASI: '+e.message)}}document.querySelector('#start').onclick=start;document.querySelector('#play').onclick=()=>{if(!('speechSynthesis'in window)){log('TTS desteklenmiyor');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Merhaba, ben Yakut. Şimdi konuşurken dur veya sus demeyi deneyin. Bu bir ses tanılama testidir.');u.lang='tr-TR';u.rate=.8;u.onstart=()=>log('Ses çalıyor; mikrofon seviye çubuğunu izle');u.onend=()=>log('Ses bitti');speechSynthesis.speak(u)};document.querySelector('#stop').onclick=()=>{enabled=false;speechSynthesis.cancel();try{rec?.abort()}catch{}rec=null;stream?.getTracks().forEach(t=>t.stop());stream=null;log('Durduruldu')};</script></body></html>
