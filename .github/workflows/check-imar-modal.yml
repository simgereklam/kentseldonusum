name: Check Modal Imar API

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-imar-modal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify Modal deployed endpoint
        env:
          MODAL_API_URL: https://kumtasinsaatmuraterdem--kumtas-imar-backend-api.us-east.modal.run
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error
          url=os.environ["MODAL_API_URL"].rstrip("/") + "/health"
          print("Checking:",url)
          try:
              with urllib.request.urlopen(url, timeout=75) as response:
                  payload=json.load(response)
                  print("Status",response.status,"response",payload)
                  if response.status!=200 or payload.get("ok") is not True:
                      raise SystemExit("Health endpoint returned unexpected payload")
          except Exception as exc:
              print("Modal health endpoint check failed:",type(exc).__name__,str(exc))
              raise
          PY
