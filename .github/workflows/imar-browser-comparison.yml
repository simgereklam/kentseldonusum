name: Compare municipal e-İmar browsers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/imar-browser-comparison.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r imar-api/requirements.txt
          python -m playwright install --with-deps chromium firefox webkit
      - name: Compare municipal responses on the same runner
        run: |
          python - <<'PY'
          import json
          import time
          from playwright.sync_api import sync_playwright, Error

          municipalities = {
              "Fatih": ("https://kentrehberi.fatih.bel.tr/webgis/", "#liImar"),
              "Bağcılar": ("https://bbgis.bagcilar.bel.tr/imardurumu/", "#tab-btn2"),
          }

          with sync_playwright() as playwright:
              for engine in (playwright.chromium, playwright.firefox, playwright.webkit):
                  try:
                      browser = engine.launch()
                  except Error as exc:
                      print(json.dumps({"browser": engine.name, "launch_error": str(exc).splitlines()[0]}, ensure_ascii=False), flush=True)
                      continue
                  try:
                      for district, (url, selector) in municipalities.items():
                          page = browser.new_page(viewport={"width": 1440, "height": 960}, locale="tr-TR")
                          start = time.monotonic()
                          result = {"browser": engine.name, "district": district, "control_visible": False}
                          try:
                              response = page.goto(url, wait_until="commit", timeout=40000)
                              result["http"] = response.status if response else None
                              if response and response.ok:
                                  page.locator(selector).wait_for(state="visible", timeout=12000)
                                  result["control_visible"] = True
                          except Error as exc:
                              result["error"] = str(exc).splitlines()[0]
                          finally:
                              page.close()
                          result["seconds"] = round(time.monotonic() - start, 1)
                          print(json.dumps(result, ensure_ascii=False), flush=True)
                  finally:
                      browser.close()
          PY
