name: Test Real Modal Kadikoy Parcel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-real-modal-kadikoy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Verify Modal credentials exist
        run: |
          test -n "$MODAL_TOKEN_ID" && test -n "$MODAL_TOKEN_SECRET"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Modal
        run: python -m pip install 'modal==1.6.4'
      - name: Test real deployed Kadikoy parcel API and both PNGs
        working-directory: imar-api
        run: modal run modal_endpoint_smoke.py
