name: Yakut Emel recordings
on:
  push:
    paths:
      - '.github/workflows/yakut-emel.yml'
      - 'yakut-v9.js'
      - 'yakut-site-voice.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recordings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install edge-tts
      - run: |
          python - <<'PY'
          import asyncio, edge_tts, pathlib, re, json, hashlib
          s=pathlib.Path('yakut-v9.js').read_text()
          phrases=set()
          site=pathlib.Path('yakut-site-voice.js').read_text()
          phrases.update(json.loads(site.split('Object.freeze(',1)[1].split(');',1)[0]).values())
          phrases.update(json.loads(re.search(r'const yakutApprovedPageSpeech=Object.freeze\((\{.*?\})\);',s).group(1)).values())
          phrases.add(re.search(r"const yakutMalikIntro='([^']+)'",s).group(1))
          pages=s.split('const yakutPages={',1)[1].split('function yakutPageName',1)[0]
          phrases.update(name+' sayfasındayız.' for name in re.findall(r"'[^']+\.html':\['([^']+)'",pages) if name!='Ana Sayfa')
          districts=s.split('const yakutDistrictPages={',1)[1].split('};',1)[0]
          phrases.update(name+' Kentsel Dönüşüm sayfasındayız.' for name in re.findall(r"'([^']+)':'[^']+'",districts))
          phrases.add('Ana sayfadayız.')
          social=s.split('function yakutSocialReply(command)')[1].split('for(let i=0;i<rules.length;i++)')[0]
          for group in re.findall(r",\[([^\[\]]+)\]\]",social):
              phrases.update(re.findall(r"'([^']+)'",group))
          out=pathlib.Path('yakut-sesler');out.mkdir(exist_ok=True)
          manifest={}
          async def main():
              for phrase in sorted(phrases):
                  name=hashlib.sha256(phrase.encode()).hexdigest()[:24]+'.mp3'
                  if not (out/name).exists():
                      await edge_tts.Communicate(phrase,'tr-TR-EmelNeural').save(str(out/name))
                  manifest[phrase]=name
              (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          asyncio.run(main())
          PY
      - run: |
          git config user.name "Yakut audio"
          git config user.email "actions@users.noreply.github.com"
          git add yakut-sesler
          git diff --cached --quiet || (git commit -m "Generate Emel MP3 recordings" && git push)
