name: Imar Playwright Manual Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/imar-playwright-test.yml'
      - 'imar-api/web_app.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  imar-sorgu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: imar-api
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: imar-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Kadıköy automation and capture images
        run: python actions_smoke_test.py

      - name: Run Bağcılar Python Playwright directly
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import asyncio
          import json
          from pathlib import Path

          from web_app import sorgula_bagcilar

          response = asyncio.run(sorgula_bagcilar({
              "ada": "0", "parsel": "2135", "mahalle": "Kirazlı",
          }))
          result = json.loads(response.body)
          assert response.status_code == 200, result
          for key in ("ekran_goruntusu_parca_1", "ekran_goruntusu_parca_2"):
              image = Path("screenshots") / Path(result[key]).name
              assert image.stat().st_size > 10000, image
              (Path("test-outputs") / image.name).write_bytes(image.read_bytes())
          print("Bağcılar Python Playwright: verified two images")
          PY

      - name: Upload test results even if query fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imar-belediye-${{ github.run_number }}
          path: imar-api/test-outputs/
          retention-days: 3
          if-no-files-found: warn
