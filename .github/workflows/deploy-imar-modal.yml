name: Deploy Imar API to Modal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-imar-modal.yml'

permissions:
  contents: read

jobs:
  modal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Check Modal token configured
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::Set MODAL_TOKEN_ID and MODAL_TOKEN_SECRET in GitHub Actions secrets first."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Modal CLI
        run: python -m pip install 'modal==1.6.4'
      - name: Deploy isolated e-imar Modal app
        working-directory: imar-api
        run: modal deploy modal_app.py
