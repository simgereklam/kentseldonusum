<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yakut Android Araya Girme Deneyi</title>
<style>body{font:16px system-ui;background:#101827;color:#f4f7ff;padding:18px;max-width:650px;margin:auto}button{font:inherit;padding:12px;margin:4px;border:0;border-radius:9px;background:#38bdf8;color:#06111c}#log{white-space:pre-wrap;background:#1e293b;padding:12px;border-radius:10px;max-height:360px;overflow:auto}input{width:100%}</style></head>
<body><h2>Yakut Android — araya girme deneyi</h2>
<p>Bu sayfa canlı Yakut'u değiştirmez. Mikrofon sesi ve tarayıcı ses tanımasını ayrı ayrı ölçer. İlk dokunuşta izin verin, konuşma sırasında “sus” deyin.</p>
<button id="start">Başlat ve konuş</button><button id="pause">Dokunarak duraklat</button><button id="resume">Devam et</button><button id="end">Kapat</button>
<p>Durum: <b id="state">Hazır</b></p><p>Mikrofon seviyesi: <meter id="level" min="0" max="1" value="0"></meter></p>
<p>Araya girme hassasiyeti (deneysel): <input id="threshold" type="range" min="2" max="20" value="9"> <span id="tval">9</span></p>
<pre id="log"></pre>
<script>
(()=>{
const $=id=>document.getElementById(id), log=(s)=>{ $('log').textContent=new Date().toLocaleTimeString()+' '+s+'\n'+$('log').textContent.slice(0,6000); };
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let ctx,stream,analyser,buf,raf,rec,recognizing=false,active=false,speaking=false,paused=false,voiceStarted=0,highSince=0,recognitionTimer=0,source,sourceStart=0,offset=0,buffer,demoActive=false;
const text='Merhaba. Ben Yakut. Android telefonlarda konuşurken araya girme özelliğini deniyoruz. Şimdi sus diyerek sözümü kesmeyi deneyebilirsiniz. Konuşmaya devam ederken mikrofonun ses seviyesini ayrıca ölçüyoruz. Durduğumda devam et diyebilirsiniz.';
function state(s){$('state').textContent=s;log(s)}
function audioStop(){if(source){try{source.stop()}catch{}source.disconnect();source=null}speaking=false}
function pause(){if(demoActive){speechSynthesis.pause();demoActive=false;paused=true;state('Demo duraklatıldı — dinliyorum');startRec();return}if(!speaking)return;offset=Math.min(buffer.duration,offset+ctx.currentTime-sourceStart);audioStop();paused=true;state('Duraklatıldı — dinliyorum');startRec()}
function resume(){if(!paused)return;if(!buffer){speechSynthesis.resume();demoActive=true;paused=false;voiceStarted=performance.now();state('Demo devam ediyor');return}paused=false;play()}
function play(){if(!buffer||!ctx)return; if(offset>=buffer.duration)offset=0;source=ctx.createBufferSource();source.buffer=buffer;source.connect(ctx.destination);sourceStart=ctx.currentTime;const thisSource=source;source.onended=()=>{if(source!==thisSource)return;source=null;speaking=false;offset=0;state('Konuşma bitti — dinliyorum');startRec()};source.start(0,offset);speaking=true;voiceStarted=performance.now();state('Yakut konuşuyor — araya girmeyi dene');startRec()}
function startRec(){if(!active||!SR||recognizing||rec)return;try{rec=new SR();const r=rec;r.lang='tr-TR';r.interimResults=true;r.continuous=false;r.onstart=()=>{recognizing=true;log('Ses tanıma başladı')};r.onresult=e=>{const t=Array.from(e.results).map(x=>x[0].transcript).join(' ').toLocaleLowerCase('tr-TR').trim();log('Duyulan: '+t);if(/^(?:(?:yakut|lütfen)\s+)*(?:sus|dur|süs)(?:\s+(?:yakut|lütfen))?$/.test(t)){pause();paused=true;state('SUS / DUR algılandı')}else if(/^(?:devam et|devam)$/.test(t)){resume()}};r.onerror=e=>{log('Tanıma hatası: '+e.error)};r.onend=()=>{recognizing=false;rec=null;if(active)recognitionTimer=setTimeout(startRec,200)};r.start()}catch(e){rec=null;log('Tanıma başlatılamadı: '+e.message);recognitionTimer=setTimeout(startRec,500)}}
function tick(){if(!active)return;analyser.getFloatTimeDomainData(buf);let sum=0;for(let i=0;i<buf.length;i++)sum+=buf[i]*buf[i];const rms=Math.sqrt(sum/buf.length);$('level').value=Math.min(1,rms*8);const threshold=Number($('threshold').value)/1000;const now=performance.now();
// This is intentionally an experimental voice-activity interruption, NOT a keyword recognizer.
// Echo cancellation varies by device. A loud speaker can cause false interruptions.
if((speaking||demoActive)&&now-voiceStarted>700&&rms>threshold){if(!highSince)highSince=now;if(now-highSince>220){log('Ses etkinliği: olası araya girme ('+rms.toFixed(3)+')');pause();highSince=0}}else highSince=0;
raf=requestAnimationFrame(tick)}
async function init(){if(active)return;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:false}});ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();analyser=ctx.createAnalyser();analyser.fftSize=1024;buf=new Float32Array(analyser.fftSize);ctx.createMediaStreamSource(stream).connect(analyser);active=true;state('Mikrofon hazır');tick();startRec();
// Produce demo speech with the browser only; production Yakut audio is untouched.
if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance(text);u.lang='tr-TR';u.onstart=()=>{demoActive=true;voiceStarted=performance.now();state('Tarayıcı demo sesi konuşuyor — seviye ölçülüyor')};u.onend=()=>{demoActive=false;state('Demo bitti — dinliyorum')};speechSynthesis.speak(u);log('Demo sesi tarayıcı speechSynthesis; Yakut sesi değiştirilmedi')}else log('Tarayıcı konuşma desteği yok')
}catch(e){state('Başlatılamadı: '+e.message)}}
$('start').onclick=init;$('pause').onclick=()=>{if(speaking||demoActive)pause();else{paused=true;state('Dokunarak susturuldu')}};$('resume').onclick=()=>{resume()};$('end').onclick=()=>{active=false;cancelAnimationFrame(raf);clearTimeout(recognitionTimer);try{rec?.abort()}catch{}rec=null;audioStop();demoActive=false;speechSynthesis?.cancel();stream?.getTracks().forEach(t=>t.stop());ctx?.close();state('Kapalı')};$('threshold').oninput=()=>{$('tval').textContent=$('threshold').value};log('Hazır. Gerçek sesli komut başarısı Android cihazda doğrulanmalı.')
})();
</script></body></html>
