services:
  - type: web
    name: kumtas-yakut-speech
    runtime: docker
    plan: free
    dockerfilePath: ./yakut-speech/Dockerfile
    dockerContext: ./yakut-speech
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: YAKUT_SPEECH_TOKEN
        generateValue: true
  - type: web
    name: kumtas-imar-sorgu
    runtime: docker
    plan: free
    dockerfilePath: ./imar-api/Dockerfile
    dockerContext: ./imar-api
    healthCheckPath: /health
    autoDeployTrigger: off
