<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yakut tarayıcı ses testi</title>
<style>
body{font:1rem system-ui;margin:3rem auto;padding:0 1rem;max-width:38rem;color:#153351}
textarea{box-sizing:border-box;display:block;width:100%;margin:.6rem 0 1rem;padding:.7rem;font:inherit}
button{padding:.6rem 1rem;font:inherit}
</style>
<h1>Yakut ses testi</h1>
<label for="text">Türkçe metin</label>
<textarea id="text" rows="4" maxlength="2000">Merhaba, hoş geldiniz. Ben Kumtaş İnşaat dijital asistanınız Yakut. Size nasıl yardımcı olabilirim?</textarea>
<button id="play">Sesi dene</button>
<button id="stop" disabled>Durdur</button>
<p id="status" role="status"></p>
<script type="module">
const text=document.querySelector('#text'),play=document.querySelector('#play'),stop=document.querySelector('#stop'),status=document.querySelector('#status');
const sources=new Set();
let context,worker,nextAt,first,started;
const ready=()=>{play.disabled=false;stop.disabled=true;};
function finish(message){status.textContent=message;ready();}
play.onclick=async ()=>{
 const phrase=text.value.trim();
 if(!phrase)return;
 play.disabled=true;stop.disabled=false;
 try{
  context ||= new AudioContext();
  await context.resume();
  if(!worker)worker=new Worker('./engine.js');
  first=true;nextAt=context.currentTime;started=performance.now();
  status.textContent='Ses motoru hazırlanıyor…';
  worker.onerror=()=>{worker.terminate();worker=null;finish('Ses motoru yüklenemedi.');};
  worker.onmessage=({data})=>{
   if(data.error){finish(data.error);return;}
   if(data.done){finish('Ses üretildi.');stop.disabled=!sources.size;return;}
   const buffer=context.createBuffer(1,data.samples.length,data.sampleRate);
   buffer.copyToChannel(data.samples,0);
   const source=context.createBufferSource();
   source.buffer=buffer;source.connect(context.destination);
   sources.add(source);
   source.onended=()=>{sources.delete(source);if(!sources.size&&!play.disabled)stop.disabled=true;};
   nextAt=Math.max(nextAt,context.currentTime+.02);
   source.start(nextAt);nextAt+=buffer.duration+.12;
   if(first){first=false;status.textContent='İlk ses: '+((performance.now()-started)/1000).toFixed(2)+' sn.';}
  };
  worker.postMessage({text:phrase});
 }catch(error){finish(error.message);}
};
stop.onclick=()=>{
 if(play.disabled&&worker){worker.terminate();worker=null;}
 for(const source of sources){try{source.stop();}catch{}}
 sources.clear();finish('Durduruldu.');
};
</script>
</html>
